name: alert-test
run-name: run unit and conformance tests

on: [pull_request]

jobs:
  runbook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: Generate giantswarm-release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: giantswarm
          # Only the private giantswarm repo needs the token, handbook is public.
          repositories: giantswarm
          permission-contents: read
      - name: Clone giantswarm runbook repo
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone --depth 1 --single-branch -b main -q "https://x-access-token:${TOKEN}@github.com/giantswarm/giantswarm.git"
      - name: Clone handbook runbook repo
        run: |
          git clone --depth 1 --single-branch -b main -q https://github.com/giantswarm/handbook.git
      - name: run runbook tests
        run: make test-ci-runbooks
      - name: validate sloth rules
        run: make sloth-validate
